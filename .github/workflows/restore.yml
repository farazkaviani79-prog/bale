{"name":"restore-from-zip","on":"workflow_dispatch","permissions":{"contents":"write"},"jobs":{"restore":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Restore","run":"ZIP=$(ls BotShop-stage*.zip | tail -1) && rm -rf /tmp/x && mkdir /tmp/x && unzip -q \"$ZIP\" -d /tmp/x && find apps -maxdepth 1 -type f -delete && rm -rf apps/web apps/api && cp -a /tmp/x/botshop/. . && (git checkout -- .github || true) && git clean -fdq .github && git rm -q -f \"$ZIP\" && git config user.name github-actions && git config user.email actions@github.com && git add -A && (git commit -m restore || true) && git push"}]}}}
