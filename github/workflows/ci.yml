# CI: روی هر Push نتیجه تست‌ها و Build را در تب Actions گیت‌هاب می‌بینید (بدون نیاز به محیط محلی).
# رمزهای زیر فقط برای دیتابیس موقت CI هستند و هیچ ارزشی ندارند.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  db-guarantees:
    name: DB — RLS, FK, CHECK, append-only, concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: botshop, POSTGRES_PASSWORD: ci_owner_pw, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botshop" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: PGHOST=localhost PGUSER=botshop PGPASSWORD=ci_owner_pw bash scripts/db-verify.sh
  app:
    name: Unit, Build, E2E (Mock Bale)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: botshop, POSTGRES_PASSWORD: ci_owner_pw, POSTGRES_DB: botshop }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botshop" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://botshop_app:CHANGE_ME_app@localhost:5432/botshop?schema=public
      SYSTEM_DATABASE_URL: postgresql://botshop_system:CHANGE_ME_system@localhost:5432/botshop?schema=public
      MIGRATE_DATABASE_URL: postgresql://botshop:ci_owner_pw@localhost:5432/botshop?schema=public
      REDIS_URL: redis://localhost:6379
      API_PORT: "4000"
      PUBLIC_API_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      MINIAPP_BASE_URL: http://localhost:3000/miniapp
      JWT_SECRET: ci-only-jwt-secret-0123456789-0123456789-0123456789
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      BALE_MODE: mock
      INITDATA_VERIFIED: "false"
      THROTTLE_MULTIPLIER: "100"   # فقط CI: تست‌ها در یک دقیقه درخواست زیادی می‌زنند
      UPLOAD_DIR: ./uploads-ci
      SEED_ADMIN_EMAIL: ci-admin@botshop.local
      SEED_ADMIN_PASSWORD: ci-admin-password-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Roles + Prisma client + Migrate + Seed
        run: |
          PGPASSWORD=ci_owner_pw psql -h localhost -U botshop -d botshop -f infra/postgres-init.sql
          npm run db:generate
          DATABASE_URL="$MIGRATE_DATABASE_URL" npm run db:migrate
          npm run db:seed
      - run: npm run test
      - run: npm run build
      - name: E2E (API زنده)
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 40); do curl -fs localhost:4000/health >/dev/null && break; sleep 1; done
          curl -fs localhost:4000/health || { cat api.log; exit 1; }
          npm --workspace @botshop/api run test:e2e || { cat api.log; exit 1; }
          ADMIN_EMAIL=$SEED_ADMIN_EMAIL ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD npm --workspace @botshop/api run test:e2e:extra || { cat api.log; exit 1; }
